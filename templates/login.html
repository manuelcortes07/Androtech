<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AndroTech · Iniciar sesión</title>
    <link rel="icon" type="image/x-icon" href="/static/favicons/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/androtech.css') }}">
    <script>
    (function(){
        var t = localStorage.getItem('at-theme');
        var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
    </script>
    <style>
        .at-login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
        .at-login-card { width: 100%; max-width: 400px; }
        .at-login-brand {
            display: flex; align-items: center; justify-content: center; gap: .6rem;
            font-family: var(--font-display); font-weight: 700; font-size: 1.4rem;
            color: var(--text); margin-bottom: 1.5rem;
        }
        .at-login-brand .at-logo { width: 38px; height: 38px; font-size: 1.2rem; }
        .at-field { margin-bottom: 1rem; }
        .at-field input { width: 100%; }
    </style>
</head>
<body class="at-app">
<div class="at-login-wrap">
    <div class="at-login-card">
        <div class="at-login-brand">
            <span class="at-logo"><i class="bi bi-phone"></i></span> AndroTech
        </div>

        <div class="at-card">
            <div class="at-card__body">
                <h1 class="at-display" style="font-size:1.35rem;margin-bottom:.25rem;">Iniciar sesión</h1>
                <p class="at-dim" style="font-size:.9rem;margin-bottom:1.5rem;">Accede al panel de gestión del taller.</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}{% for category, message in messages %}
                        <div class="alert alert-{{ category }} py-2"><small>{{ message }}</small></div>
                    {% endfor %}{% endif %}
                {% endwith %}

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="at-field">
                        <label class="at-label" for="usuario"><i class="bi bi-person me-1"></i>Usuario</label>
                        <input class="at-input" type="text" id="usuario" name="usuario" required
                               autocomplete="username" placeholder="Tu usuario">
                    </div>
                    <div class="at-field">
                        <label class="at-label" for="contrasena"><i class="bi bi-lock me-1"></i>Contraseña</label>
                        <input class="at-input" type="password" id="contrasena" name="contraseña" required
                               autocomplete="current-password" placeholder="Tu contraseña">
                    </div>
                    <button type="submit" class="at-btn at-btn--primary" style="width:100%;justify-content:center;margin-top:.5rem;">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>

                <div class="text-center" style="margin-top:1.25rem;">
                    <a href="{{ url_for('reset_solicitar') }}" style="font-size:.88rem;">¿Olvidaste tu contraseña?</a>
                </div>
            </div>
        </div>

        <p class="text-center at-dim" style="font-size:.8rem;margin-top:1.25rem;">
            <i class="bi bi-shield-check me-1"></i>Sistema de gestión AndroTech
        </p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
