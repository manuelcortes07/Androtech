<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kintsu · Iniciar sesión</title>

    <link rel="icon" type="image/x-icon" href="/static/favicons/favicon.ico">
    <meta name="theme-color" content="#0A0E17">

    <!-- Tema antes del primer pintado (anti-parpadeo) -->
    <script nonce="{{ csp_nonce }}">
    (function(){
        try{
            var t = localStorage.getItem('at-theme');
            document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
    })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/androtech.css') }}">
</head>

<body class="at-public">

<button class="at-tgl at-u247" id="atThemeToggle" type="button" aria-label="Cambiar tema"
       >☀</button>

<div class="at-auth">
    <div class="at-glow at-g1 at-u248"></div>
    <div class="at-glow at-g2 at-u249"></div>

    <div class="at-auth-card at-reveal at-reveal--load">
        <div class="at-u250">
            <a class="at-brand at-u251" href="/">
                <span class="at-logo at-u252">⬡</span>Kintsu
            </a>
            <p class="at-dim at-u253">Accede al panel de gestión del taller.</p>
        </div>

        <div class="at-card">
            <div class="at-card__body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                        <div class="at-alert at-alert--{{ 'danger' if category == 'danger' else 'success' if category == 'success' else 'info' }} at-u254" role="alert">
                            <i class="bi bi-info-circle-fill"></i><span>{{ message }}</span>
                        </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <div class="at-u255">
                        <label class="at-label" for="usuario"><i class="bi bi-person"></i> Usuario</label>
                        <input class="at-input" type="text" id="usuario" name="usuario" required
                               autocomplete="username" placeholder="Tu usuario">
                    </div>

                    <div class="at-u256">
                        <label class="at-label" for="contraseña"><i class="bi bi-lock"></i> Contraseña</label>
                        <input class="at-input" type="password" id="contraseña" name="contraseña" required
                               autocomplete="current-password" placeholder="Tu contraseña">
                    </div>

                    <div class="at-u257">
                        <a href="{{ url_for('reset_solicitar') }}" class="at-u258">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="at-btn at-btn--primary at-btn--block at-btn--lg">
                        <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                    </button>
                </form>
            </div>
            <div class="at-card__foot at-u259">
                <a href="/" class="at-u260"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
            </div>
        </div>

        <p class="at-dim at-u261">
            <i class="bi bi-shield-check"></i> Sistema de gestión Kintsu
        </p>
    </div>
</div>

<script nonce="{{ csp_nonce }}">
(function(){
    var html = document.documentElement;
    var tgl = document.getElementById('atThemeToggle');
    function syncIcon(){ if(tgl) tgl.textContent = html.getAttribute('data-theme') === 'dark' ? '☀' : '☾'; }
    syncIcon();
    if(tgl){
        tgl.addEventListener('click', function(){
            var dark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', dark ? 'light' : 'dark');
            try{ localStorage.setItem('at-theme', dark ? 'light' : 'dark'); }catch(e){}
            syncIcon();
        });
    }
    if(!window.matchMedia('(prefers-reduced-motion:reduce)').matches){
        setTimeout(function(){ document.querySelector('.at-reveal--load').classList.add('is-in'); }, 80);
    }else{
        document.querySelector('.at-reveal--load').classList.add('is-in');
    }
})();
</script>

</body>
</html>
