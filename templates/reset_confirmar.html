<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kintsu · Nueva contraseña</title>
    <script nonce="{{ csp_nonce }}">(function(){try{var t=localStorage.getItem('at-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/androtech.css') }}">
</head>
<body class="at-public">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill at-u279"></i>
                <h1 class="h4 fw-bold mt-2">Elige una nueva contraseña</h1>
            </div>
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}{% for category, message in messages %}
                            <div class="alert alert-{{ category }} py-2"><small>{{ message }}</small></div>
                        {% endfor %}{% endif %}
                    {% endwith %}
                    <form method="POST" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock-fill me-1"></i>Nueva contraseña
                            </label>
                            <input type="password" class="form-control" id="password" name="password"
                                   required minlength="8" autocomplete="new-password"
                                   placeholder="Mínimo 8 caracteres, con mayúscula y número">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Guardar contraseña</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
